<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="manifest" href="manifest.webmanifest?v=0.2.0">
  <link rel="icon" href="assets/icon.svg?v=0.2.0">
  <link rel="stylesheet" href="css/app.css?v=0.2.0">
  <title>Eco</title>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">Eco <small id="version"></small></div>
      <div class="headerActions">
        <button id="sessionsButton" class="iconButton" aria-label="Sesiones"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg></button>
        <button id="agentButton" class="iconButton" aria-label="Agente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8Z" /><path d="M18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8Z" /></svg></button>
        <button id="settingsButton" class="iconButton" aria-label="Ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></svg></button>
      </div>
    </header>
    <section id="notice" class="notice" hidden><span>Configura tu clave para empezar.</span><button data-open-settings type="button">Ajustes</button></section>
    <section id="todoBar" class="todoBar" hidden></section>
    <section id="chat" aria-live="polite"><div class="empty" id="empty">Preparando el agente…</div></section>
    <form id="composer"><textarea id="prompt" rows="1" placeholder="Preparando el agente…" aria-label="Mensaje"></textarea><button id="send" type="submit" disabled>Enviar</button></form>
  </main>
  <aside class="panel" id="sessionsPanel" hidden><div class="panelHead"><h2>Sesiones</h2><button data-close type="button">Listo</button></div><input id="sessionSearch" type="search" placeholder="Buscar historial" aria-label="Buscar historial"><div id="sessionList" class="list"></div><button id="newSession" type="button">Nueva sesión</button></aside>
  <aside class="panel" id="agentPanel" hidden><div class="panelHead"><h2>Agente</h2><button data-close type="button">Listo</button></div><div class="tabs"><button data-tab="memory" type="button">Memoria</button><button data-tab="todos" type="button">Tareas</button><button data-tab="skills" type="button">Habilidades</button></div><div id="agentContent" class="list"></div></aside>
  <dialog id="settings"><div class="panelHead"><h2>Ajustes</h2><button data-close type="button">Cerrar</button></div><label>Clave OpenRouter<input id="openrouterKey" type="password" autocomplete="off"></label><label>Modelo<input id="model" autocomplete="off"></label><h3 class="sectionTitle">Conectores</h3><div id="connectorList" class="connectorList"></div><button id="clearData" class="danger" type="button">Borrar datos locales</button></dialog>
  <dialog id="confirm"><h2>Confirmar acción</h2><p id="confirmText"></p><pre id="confirmArgs"></pre><div class="actions"><button id="cancelConfirm" type="button">Cancelar</button><button id="approveConfirm" type="button">Aprobar</button></div></dialog>
  <dialog id="clarify"><h2 id="clarifyQuestion"></h2><div id="clarifyOptions" class="clarifyOptions"></div><form id="clarifyForm"><input id="clarifyText" placeholder="Tu respuesta"><button type="submit">Continuar</button></form></dialog>
  <script type="module" src="js/app.js?v=0.2.0"></script>
</body>
</html>
