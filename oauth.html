<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Eco</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }
  </style>
</head>
<body>
  <p id="status">Conectando…</p>
  <script>
    const MESSAGE_TYPE = "eco-oauth";
    const params = {};
    for (const source of [location.search.slice(1), location.hash.slice(1)]) {
      for (const [key, value] of new URLSearchParams(source)) {
        params[key] = value;
      }
    }
    if (window.opener) {
      window.opener.postMessage({ type: MESSAGE_TYPE, params }, location.origin);
      window.close();
    } else {
      document.getElementById("status").textContent = "Puedes cerrar esta ventana.";
    }
  </script>
</body>
</html>
