<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Eco</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }
  </style>
</head>
<body>
  <p id="status">Connecting…</p>
  <script>
    const MESSAGE_TYPE = "eco-oauth";
    const params = {};
    for (const source of [location.search.slice(1), location.hash.slice(1)]) {
      for (const [key, value] of new URLSearchParams(source)) {
        params[key] = value;
      }
    }
    history.replaceState(null, "", location.pathname);
    if (params.state && typeof BroadcastChannel === "function") {
      const channel = new BroadcastChannel("eco-oauth-" + params.state);
      channel.postMessage({ type: MESSAGE_TYPE, params });
      channel.close();
    }
    const target = window.opener || (window.parent !== window ? window.parent : null);
    if (target) {
      target.postMessage({ type: MESSAGE_TYPE, params }, location.origin);
      if (window.opener) {
        window.close();
      }
    } else {
      document.getElementById("status").textContent = "You can close this window.";
    }
  </script>
</body>
</html>
